<div id="completion-screen" class="hidden">
        <h2>Experiment Results</h2>
        <p id="status-msg">Uploading data...</p>
        <div style="width: 80%; max-width: 800px; margin: 0 auto;">
            <canvas id="rt-histogram"></canvas>
        </div>
        <button onclick="window.location.reload()" style="margin-top: 20px;">Restart Task</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby88d_J7Vx-pxiV5XO2_uqreYC1X6ocVMA9NZ63_jcpw9K0S8u3XGq459AcqYQ-5vA9/exec';
        
        let participantId = "";
        let trials = [];
        let currentTrial = 0;
        const totalTrials = 10;
        let startTime;
        let circleData = { x: 0, y: 0, radius: 50 };

        const welcomeScreen = document.getElementById('welcome-screen');
        const taskCanvas = document.getElementById('task-canvas');
        const completionScreen = document.getElementById('completion-screen');
        const ctx = taskCanvas.getContext('2d');

        document.getElementById('start-btn').addEventListener('click', () => {
            const inputVal = document.getElementById('participant-id').value.trim();
            participantId = inputVal || "ID-" + Math.random().toString(36).substring(2, 7).toUpperCase();
            welcomeScreen.classList.add('hidden');
            taskCanvas.style.display = 'block';
            resizeCanvas();
            startNewTrial();
        });

        function resizeCanvas() {
            taskCanvas.width = window.innerWidth;
            taskCanvas.height = window.innerHeight;
        }

        function startNewTrial() {
            if (currentTrial >= totalTrials) {
                processResults();
                return;
            }
            ctx.clearRect(0, 0, taskCanvas.width, taskCanvas.height);
            setTimeout(() => {
                const padding = circleData.radius * 2;
                circleData.x = Math.random() * (taskCanvas.width - padding) + circleData.radius;
                circleData.y = Math.random() * (taskCanvas.height - padding) + circleData.radius;
                ctx.beginPath();
                ctx.arc(circleData.x, circleData.y, circleData.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#00d1b2";
                ctx.fill();
                ctx.closePath();
                startTime = performance.now();
            }, 500);
        }

        taskCanvas.addEventListener('mousedown', (e) => {
            if (!startTime) return;
            const rect = taskCanvas.getBoundingClientRect();
            const dist = Math.sqrt(Math.pow((e.clientX - rect.left) - circleData.x, 2) + Math.pow((e.clientY - rect.top) - circleData.y, 2));
            if (dist < circleData.radius) {
                const rt = Math.round(performance.now() - startTime);
                startTime = null; 
                currentTrial++;
                trials.push({ Participant_ID: participantId, Trial_Number: currentTrial, Reaction_Time: rt });
                startNewTrial();
            }
        });

        async function processResults() {
            taskCanvas.style.display = 'none';
            completionScreen.classList.remove('hidden');
            const status = document.getElementById('status-msg');

            // 1. Calculate current user average
            const userAvg = trials.reduce((a, b) => a + b.Reaction_Time, 0) / totalTrials;

            try {
                // 2. Upload current data
                for (const trial of trials) {
                    await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(trial) });
                }
                status.innerText = "Data synced. Fetching community benchmarks...";

                // 3. GET historical data
                const response = await fetch(WEB_APP_URL);
                const historicalRTs = await response.json();

                renderChart(historicalRTs, userAvg);
                status.innerHTML = `Your Average: <strong>${Math.round(userAvg)}ms</strong>. See how you compare below:`;
            } catch (err) {
                status.innerText = "Error loading chart. Please refresh.";
                console.error(err);
            }
        }

        function renderChart(data, userAvg) {
            const ctxChart = document.getElementById('rt-histogram').getContext('2d');
            
            // Basic binning logic for histogram (bins of 50ms)
            const binSize = 50;
            const bins = {};
            data.forEach(val => {
                const bin = Math.floor(val / binSize) * binSize;
                bins[bin] = (bins[bin] || 0) + 1;
            });

            const labels = Object.keys(bins).sort((a, b) => a - b);
            const counts = labels.map(l => bins[l]);

            new Chart(ctxChart, {
                type: 'bar',
                data: {
                    labels: labels.map(l => `${l}ms`),
                    datasets: [{
                        label: 'Frequency (Historical)',
                        data: counts,
                        backgroundColor: 'rgba(0, 209, 178, 0.4)',
                        borderColor: '#00d1b2',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: { y: { beginAtZero: true } },
                    plugins: {
                        autocolors: false,
                        annotation: { // Vertical line logic
                            annotations: {
                                line1: {
                                    type: 'line',
                                    xMin: labels.findIndex(l => userAvg < parseInt(l) + binSize),
                                    xMax: labels.findIndex(l => userAvg < parseInt(l) + binSize),
                                    borderColor: 'rgb(255, 99, 132)',
                                    borderWidth: 4,
                                    label: { content: 'YOU', enabled: true, position: 'top' }
                                }
                            }
                        }
                    }
                }
            });
        }
        window.addEventListener('resize', resizeCanvas);
    </script>
